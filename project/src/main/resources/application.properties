spring.application.name=project
# Enable H2 console
spring.h2.console.enabled=true

# Path to access the H2 console in the browser
spring.h2.console.path=/h2-console

# JDBC URL for in-memory H2 database
spring.datasource.url=jdbc:h2:mem:testdb

# JDBC URL for file-based H2 database (optional)
# spring.datasource.url=jdbc:h2:file:~/testdb

# H2 database driver class name
spring.datasource.driverClassName=org.h2.Driver

# H2 database username
spring.datasource.username=sa

# H2 database password (leave blank for default)
spring.datasource.password=

# Hibernate properties (optional)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true